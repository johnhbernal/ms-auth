# ── Test profile (also used with @ActiveProfiles({"dev","test"})) ────────────
# Self-contained H2 + JWT so tests do not require only the "dev" profile for secrets.

# ── DataSource (H2 in-memory) ────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway off — Hibernate create-drop owns schema in tests
spring.flyway.enabled=false

# PracticaServiceClient is replaced by @MockBean — placeholder URL avoids warnings
ms-practica.url=http://localhost:0

# JWT test secrets (≥32 chars) — override env placeholders from application.properties
app.jwt.secret-master=test-master-secret-key-at-least-32-chars!!
app.jwt.secret-session=test-session-secret-key-at-least-32-chars!
