# Dev-only — activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# NEVER copy these JWT values to production.

# ── DataSource (H2 in-memory) ────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway migrations target Postgres; Hibernate owns schema in local H2
spring.flyway.enabled=false

# ── H2 Console / Swagger ─────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ── JWT (dev secrets — ≥32 chars) ────────────────────────────────────────────
app.jwt.secret-master=dev-master-secret-key-for-local-development-only-x
app.jwt.secret-session=dev-session-secret-key-for-local-development-only-x
