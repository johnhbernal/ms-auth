# Production — activate with SPRING_PROFILES_ACTIVE=prod (or -Dspring.profiles.active=prod)
# All secrets and datasource credentials MUST come from the environment.

# ── DataSource (PostgreSQL) ──────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Schema owned by Flyway
spring.flyway.enabled=true

# ── Hardening ────────────────────────────────────────────────────────────────
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# JWT required from environment (no defaults)
app.jwt.secret-master=${APP_JWT_SECRET_MASTER}
app.jwt.secret-session=${APP_JWT_SECRET_SESSION}
