# ── Application ─────────────────────────────────────────────────────────────
spring.application.name=ms-auth
server.port=8081

# Profiles (activate explicitly — never hardcode spring.profiles.active here):
#   dev  — H2 in-memory, ddl-auto=update, Flyway off, Swagger + H2 console
#   test — H2 in-memory, ddl-auto=create-drop, Flyway off (src/test/resources)
#   prod — PostgreSQL + Flyway, ddl-auto=validate (application-prod.properties)
# Datasource / JPA dialect are profile-owned. Local run:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev

# ── JWT (required via environment — no defaults) ────────────────────────────
app.jwt.secret-master=${APP_JWT_SECRET_MASTER}
app.jwt.secret-session=${APP_JWT_SECRET_SESSION}
app.jwt.master-expiration-ms=86400000
app.jwt.session-expiration-ms=900000

# ── Feign clients ────────────────────────────────────────────────────────────
ms-practica.url=${MS_PRACTICA_URL:http://localhost:8082}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Override via env var in production (e.g. https://myfrontend.com)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Swagger / OpenAPI (off by default; enable in dev profile) ────────────────
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── JPA (shared; dialect + ddl-auto + datasource live in profiles) ───────────
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
